[package]
name = "rr_reader"
version = "0.1.0"
edition = "2021"
resolver = "2"
rust-version = "1.82"

[[bin]]
name = "rr_reader"
path = "src/main.rs"
harness = false

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = false

[features]
default = ["std"]
std = ["esp-idf-hal/std", "esp-idf-svc/std"]

[dependencies]
anyhow = { version = "1", default-features = false }
esp-idf-hal = { version = "0.46.2", features = ["adc-oneshot-legacy"] }
esp-idf-svc = "0.52.1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
jpeg-decoder = { version = "0.3", default-features = false }
log = "0.4"
pulldown-cmark = { version = "0.13", default-features = false }

[build-dependencies]
embuild = "0.33"

[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = ["native"]
bindings_header = "native/include/rr_idf_shim.h"
